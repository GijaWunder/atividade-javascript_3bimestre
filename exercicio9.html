<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        /*embelezando*/
        body{
            font-family: 'Times New Roman', Times, serif;
            transition: 3s;
        }

        /*tema claro*/
        body.claro{
            background-color: rgb(255, 255, 255);
            color: rgb(0, 0, 0);
        }

        /*tema escuro*/
        body.escuro{
            background-color: rgb(0, 0, 0);
            color: rgb(255, 255, 255);
        }

        #btnSalvar{
            margin-bottom: 50px;
        }

        input{
            width: 50%;
            height: 60px;
        }

        #mensagem{
            font-size: 30px;
        }

    </style>

</head>
<body>
    
    <form id="formPreferencias">

        <div class="grupo">
            <label for="">
                Tema:
            </label>

            <select name="" id="tema">

                <option value="claro">
                    Claro
                </option>

                <option value="escuro">
                    Escuro
                </option>

            </select>
        </div>

        <div class="grupo">
            <button id="btnSalvar">Salvar preferências</button>
        </div>

    </form>

    <div class="sorvete">
        <input type="text" value="">
        <div id="mensagem"></div>
    </div>
    

    <script>

        //elementos html//
        const body = document.querySelector('body')
        const form = document.querySelector('#formPreferencias')
        const tema = document.querySelector('#tema')

        //carregar dados do localStorage
        const temaSalvo = localStorage.getItem('tema')

        if (tema) {
            aplicarTema(temaSalvo)
        }

        //salvar preferencia//
        form.addEventListener('submit', (evento)=>{
            evento.preventDefault() //evita o comportamento padrao do form que é enviar e atualizar a pagina

            //recuperar informacoes
            const temaSelecionado = tema.value 

            aplicarTema(temaSelecionado)
            salvarTema(temaSelecionado)
        })

        //aplicar tema
        function aplicarTema(temaSelecionado){
            //remove as classes de temas anterores 
            body.classList.remove('claro', 'escuro')

            //adiciona o tema escolhido
            body.classList.add(temaSelecionado)

            //salva a opcao que foi selecionada
            tema.value = temaSelecionado

        }

        //salvar tema
        function salvarTema(tema){
            localStorage.setItem('tema', tema)

        }

        const campoTexto = document.querySelector("input")
        const mensagem = document.querySelector("#mensagem")

        campoTexto.addEventListener("input", ()=>{
            let digitado = campoTexto.value

            if (digitado.length > 3) { //conta quantos caracteres foram digitados

                if(digitado == "chocolate"){
                    mensagem.innerText = "Eu amo sorvete de chocolate!"

                }else if(digitado == "flocos"){
                    mensagem.innerText = "Ahh, mas chocolate é o meu favorito..."

                }else{
                    mensagem.innerText = "Ahh, eu esperava um sabor de sorvete..."
                }

            }
        })

    </script>
    
</body>
</html>
